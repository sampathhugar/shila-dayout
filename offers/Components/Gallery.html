<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="../Styles/Gallery.css">
    <title>Gallery</title>
</head>
<body>
    <div class="pictureComponent-container">
        <section class="accommodations-section">
            <div class="Feedback-container-topper-text">
               Our Gallery --
           </div>
           <div class="Feedback-header-text">
            A Glimpse Into
           </div>
           <div class="Feedback-header-text-2">
            Our World.
           </div>
           <div class="Feedback-header-bottom-text">
            "Step into our gallery and explore the essence of what we offer – a curated collection of images that capture the beauty, elegance, and uniqueness of our spaces."      
           </div>
          </section>

        <div class="picture-container">
            <div class="picture-sub-1">
                <img id="gallery-block-1" src="../Resource/Gallary/gallary-img1.jpg" alt="img" class="picturecomponent-img3" loading="lazy"/>
                <img id="gallery-block-2" src="../Resource/Gallary/gallary-img2.jpg" alt="img" class="picturecomponent-img2" loading="lazy"/>

                <img id="gallery-block-6" src="../Resource/Gallary/gallary-img6.jpg" alt="img" class="picturecomponent-img1" loading="lazy"/>
            </div>
            

            <div class="pictureComponent-content">
                <div class="pictureComponent-sub1">
                    <img src="../Resource/instagram.avif" alt="img" class="pictureComponent-logo1" loading="lazy"/>
                    <div class="pictureComponent-content-text">#Shilhaandara</div>
                </div>

                <div>
                    <a href="https://www.instagram.com/shilhaandara?igsh=ZmF6YmdueG92YXQ=" target="_blank" rel="noopener noreferrer">
                    <button class="Book-your-day-ou-btn follow-hashtag-button">
