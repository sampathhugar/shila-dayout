    <script>
        // Helper function to load external JavaScript files dynamically
        const loadScriptHeroScript = (src) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        };
    
        // Fetch and load the Hero section and its dependencies
        fetch('Components/Hero.html')
            .then(response => response.text())
            .then(async (data) => {
                // Insert Hero HTML into the container
                document.getElementById('Hero-container').innerHTML = data;
    
                // Load swiper-bundle.min.js first
                try {
                    await loadScriptHeroScript('JSfiles/swiper-bundle.min.js');    
                    // Then, load Hero.js
                    const script = document.createElement('script');
                    script.src = 'JSfiles/Hero.js';
                    document.body.appendChild(script);
                } catch (error) {
                    console.error('Error loading scripts:', error);
                }
            })
            .catch(error => console.error('Error loading Hero section:', error));
    </script>
     
    <script>
        // Function to dynamically load scripts
        const loadScript = (src) => {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        };
    
        // Function to load HTML content and its corresponding JS
        const loadContent = async (htmlPath, sectionId, scriptPath) => {
            try {
                const response = await fetch(htmlPath);
                const data = await response.text();
                // Load the HTML content
                document.getElementById(sectionId).innerHTML = data;
    
                // Load the JS file for that section
                await loadScript(scriptPath);
            } catch (error) {
                console.error('Error loading content or script:', error);
            }
        };
    
        // Load all content and scripts in sequence
        const loadAllContent = async () => {
            // First, load the Swiper library globally
            await loadScript('JSfiles/swiper-bundle.min.js');
    
            // Then, load the content and scripts for accommodations and activities
            await loadContent('Components/Activities.html', 'activities-section', 'JSfiles/Activities.js');
            await loadContent('Components/Accomodation.html', 'accommodations-section', 'JSfiles/Accomodation.js');
        };
    
        // Start loading all content and scripts
        loadAllContent();
    </script>
