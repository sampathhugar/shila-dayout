<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/swiper-bundle.min.css">
    <link rel="stylesheet" href="../Styles/ResortSlider.css">
    <title>Resorts</title>
</head>
<body>
    <div class="Other-resorts-section">
    <div class="Activities-total-holder">
        <!-- <div class="arrow-left-section">   
           <div class="arrow-holder-left">            
              <i class="ri-arrow-left-s-line"></i>
           </div>
        </div> -->
     <div class="Activities-cards-component">
     <section class="container">
     <div class="card__container swiper">
        <div class="resort-card__content">
           <div class="swiper-wrapper">
              <article class="card__article swiper-slide">
               <a href="https://guhantara.com/" style="text-decoration: none;" target="_blank">
                 <div class="resort-card__data" style="background-image: url('../Resource/guhaantara-poster.avif');background-size: cover;background-position: center;background-repeat: no-repeat;">
                  <div class="Resort-heading-section">
                     <img src="../Resource/guhantaralogo.png" class="Slider-logos"/>
                     <div class="Otherresorts-Resort-name">Guhantara</div>
                  </div>
                  <div class="Resort-location-section">@Bengaluru</div>
                 </div>
               </a>
              </article>
  
              <article class="card__article swiper-slide">
               <a href="https://sirinatureroost.com/" style="text-decoration: none;" target="_blank">
                 <div class="resort-card__data" style="background-image: url('../Resource/siri-poster.avif');background-size: cover;background-position: center;background-repeat: no-repeat;">
                  <div class="Resort-heading-section">
                     <img src="../Resource/sirilogo.png" class="Slider-logos"/>
                     <div class="Otherresorts-Resort-name Resort-Slider-width-fixer">Siri Nature Roosts</div>
                  </div>
                  <div class="Resort-location-section">@Chikmagalur</div>
               </div>
            </a>
              </article>
  
              <article class="card__article swiper-slide">
               <a href="https://jhari.in/" style="text-decoration: none;" target="_blank">
                 <div class="resort-card__data" style="background-image: url('../Resource/jhari-poster.avif');background-size: cover;background-position: center;background-repeat: no-repeat;">
                  <div class="Resort-heading-section">
                     <img src="../Resource/jharilogo.png" class="Slider-logos"/>
                     <div class="Otherresorts-Resort-name">Jhari Eco Stay</div>
                  </div>
                  <div class="Resort-location-section">@Chikmagalur</div>
               </div>
            </a>
              </article>

              <article class="card__article swiper-slide" id="staycation-slide-mobile">
                 <div class="resort-card__data" style="background-image: url('../Resource/Rashi_staycation-slider.avif');background-size: cover;background-position: center;background-repeat: no-repeat;">
                  <div class="Resort-heading-section">
               </div>
              </article>

              <article class="card__article swiper-slide">
               <a href="https://rashiecotourism.com/" style="text-decoration: none;" target="_blank">
                 <div class="resort-final-card__data" style="background-color:#B8A884">
                  <div class="Other-resorts-finalSlide">
                     <img src="../Resource/rashi-logo.avif" class="other-resorts-rashi-img"/>
                     <div class="Other-resorts-text">Other Resorts Of</div>
                     <div class="Rashi-Eco-Tourism-text">Rashi Eco Tourism</div>
                  </div>
               </div>
            </a>

           </div>
        </div>
     </div>
  </section>
   </div>
  
  <!-- <div class="arrow-right-section">
  <div class="arrow-holder-right">            
     <i class="ri-arrow-right-s-line"></i>
  </div>
  </div> -->
  </div>
  </div>
</div>
  <!--=============== SWIPER JS ===============-->
  <script src="../JSfiles/swiper-bundle.min.js" defer></script>

  <!--=============== MAIN JS ===============-->
  <script src="../JSfiles/Activities.js" defer></script>
</body>
</html>
