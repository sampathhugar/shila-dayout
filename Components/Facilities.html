    <link rel="stylesheet" href="../Styles/Facilities.css">

<body>
  <div class="Facilities-heading-container">
    <div class="Feedback-container-topper-text">
      What We Offer --

  <div class="Feedback-header-text">
    How Our Facilities

  <div class="Feedback-header-text-2">
    Exceed Expectations.
  </div>
  <div class="Feedback-header-bottom-text">

  </div>
  </div>
<div class="Facilities-Outer-Container">
  <div class="Facilities-Container-left">

    <div class="Facilities-Container">
        <div class="Facilities-Container-right">

            <h2 id="Facilities-Container-heading"></h2>
            <p id="Facilities-Container-description"></p>

        </div>
      </div>

          <span class="Package-close-btn" id="facilities-popup-close">&times;</span>
