<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packages</title>
  <link rel="stylesheet" href="../Styles/Experiences.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="Packages-Section" id="packages">
      <div class="Packages-content-Placer">
        <p class="Feedback-container-topper-text">What You Experience --</p>
      <h1 class="Feedback-header-text">Day Out Packages</h1>
      <span class="Feedback-header-text-2"> We Provide.</span>
      <div class="Package-underline"></div>
    </div>
      <div class="Package-Cards">
        <div class="Package-card-1" loading="lazy">
          <p>Supply of Food</p>
          <div class="experiences-button-container">
          <button class="experiences-know-more-btn" data-popup-id="Foodie-buddy">KNOW MORE</button>
          </div>
        </div>
        <div class="Package-card-2" loading="lazy">
          <p>Carnival</p>
          <div class="experiences-button-container">
            <button class="experiences-know-more-btn" data-popup-id="Carnival">KNOW MORE</button>
            </div>
        </div>
        <div class="Package-card-3" loading="lazy">
          <p>Extravagant</p>
          <div class="experiences-button-container">
            <button class="experiences-know-more-btn" data-popup-id="Extravagant">KNOW MORE</button>
          </div>
        </div>
      </div>

    <div class="Packages-section-buttons-holder">
      <button class="Book-your-day-ou-btn experiences-button-fixer" onclick="bookDayOut()">Book Your Day Out</button>
      <a href="https://rashiecotourism.com/shil-brouchure2.pdf" target="_blank">
      <button class="Book-your-day-ou-btn experiences-button-fixer">Download Pdf</button>
    </a>
    </div>
    </div>

    <script src="../JSfiles/Experiences.js"></script>
</body>
</html>
